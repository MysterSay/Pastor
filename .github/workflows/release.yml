name: Automated Release and Documentation

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  create-release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Chuck Norris Joke
        id: chuck_joke
        run: |
          JOKE_JSON=$(curl -s https://api.chucknorris.io/jokes/random)
          JOKE_TEXT=$(echo "$JOKE_JSON" | jq -r '.value' | tr -d '"' | tr -d "'" | tr -d '\n')
          echo "joke=$JOKE_TEXT" >> $GITHUB_OUTPUT

      - name: Set Release Version
        id: versioning
        run: |
          VERSION="v1.0.${{ github.run_number }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Git Tag and GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.versioning.outputs.version }}
          release_name: Release ${{ steps.versioning.outputs.version }}
          body: |
            ### Release Details
            - **Merged PR:** ${{ github.event.pull_request.title }}

            ---
            😂 **Chuck Norris Release Joke:**
            _${{ steps.chuck_joke.outputs.joke }}_
          draft: false
          prerelease: false

      - name: Update README.md
        run: |
          sed -i '/## Latest Release Info/,$d' README.md
          echo -e "\n## Latest Release Info" >> README.md
          echo "- **Version:** ${{ steps.versioning.outputs.version }}" >> README.md
          echo "- **PR Title:** ${{ github.event.pull_request.title }}" >> README.md
          echo "- **Chuck Norris Joke:** ${{ steps.chuck_joke.outputs.joke }}" >> README.md

      - name: Commit and Push changes to README
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git commit -m "docs: auto-update README with release info [skip ci]"
          git push origin main

      - name: Leave a Comment on Pull Request
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Release ${'${{ steps.versioning.outputs.version }}'}** has been successfully deployed!\n\n🤖 *Chuck Norris automated comment:* "${'${{ steps.chuck_joke.outputs.joke }}'}"`
            })
